.wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.brand{text-shadow:none;font-family:var(--display);color:#fff;line-height:.95;font-weight:400;text-shadow:3px 3px 0 #14061f,6px 6px 0 var(--pink)}
h1.brand{font-size:clamp(46px,13vw,104px);margin:0;transform:rotate(-4deg);text-align:center;}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.tag{font-family:var(--script);font-size:32px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.lead{font-family:var(--script);font-weight:400;text-shadow:2px 2px 0 var(--ink);font-size:clamp(26px,6vw,42px);line-height:1.2;margin:10px 0}
.when{font-family:var(--script);font-size:clamp(28px,6vw,38px);color:#fff;text-shadow:2px 2px 0 var(--ink)}
button,.btn{font-family:var(--body);font-size:20px;color:#fff;background:var(--pink);border:0;border-radius:4px;padding:14px 30px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:4px 4px 0 var(--cyan)}
button:hover,.btn:hover{transform:translate(-1px,-1px)}
button.ghost{background:transparent;border:2px solid var(--mut);box-shadow:none;color:var(--mut)}
button.sm{font-size:13px;padding:6px 10px;box-shadow:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:24px;margin-top:20px;backdrop-filter:blur(6px)}
h2{font-family:var(--script);font-weight:400;font-size:36px;margin:0 0 6px}
p.sub{margin:0 0 18px;color:var(--mut)}
label{display:block;margin:14px 0 4px;color:var(--mut)}
input,select{text-shadow:none;width:100%;font:inherit;color:#fff;background:#0d0416;border:1px solid #6b3a85;border-radius:4px;padding:11px 12px}
input.bad{border-color:#ff6b6b}
.row{display:flex;gap:12px;justify-content:space-between;margin-top:24px;align-items:center}
.prog{display:flex;gap:6px;margin-bottom:6px}.prog i{flex:1;height:4px;background:#4a2763;border-radius:2px}.prog i.on{background:var(--cyan)}
.mate{border-top:1px dashed #6b3a85;margin-top:16px;padding-top:4px}
.mate b{font-family:var(--script);font-weight:400;font-size:25px;color:var(--cyan)}

</style></head><body>
<div class="bg" aria-hidden="true"></div>
<div class="trees" aria-hidden="true"></div>

<main class="wrap" id="app"></main>
<script>
"use strict";
/*
 HACKFUSION 2K27 - registration front-end
 TRUST MODEL: this page is an UNTRUSTED client. Everything checked here is for
 user convenience only. Google Apps Script (Code.gs) re-validates everything,
 generates the Registration ID, sets paymentStatus=PENDING and stamps the time.
*/
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOTAL = 6, MAX_EXTRA = 4;

/* ---------- validation helpers ---------- */
const RE = {
  phone: /^(?:\+91)?[6-9]\d{9}$/,
  email: /^[a-z0-9._%+\-]+@[a-z0-9](?:[a-z0-9\-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9\-]*[a-z0-9])?)*\.[a-z]{2,}$/,
  name: /^[\p{L}][\p{L}\p{M} .'’\-]{1,79}$/u,
  utr: /^[A-Z0-9]{8,22}$/,
  int: /^\d+$/,
  date: /^\d{4}-\d{2}-\d{2}$/,
  time: /^([01]\d|2[0-3]):[0-5]\d$/
};
const clean = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
const normEmail = v => String(v || '').trim().toLowerCase();
const normPhone = v => { const s = String(v || '').replace(/[\s\-()]/g, ''); return RE.phone.test(s) ? '+91' + s.slice(-10) : ''; };
const normUtr = v => String(v || '').replace(/\s+/g, '').toUpperCase();
const intOf = v => RE.int.test(String(v).trim()) ? parseInt(v, 10) : NaN;
const emailOk = e => e.length <= 254 && RE.email.test(e) && !e.includes('..');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const daysAgoStr = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const isConfigured = v => typeof v === 'string' && v.trim() !== '' && !v.includes('PASTE_');
const imgOk = u => isConfigured(u) && (/^https:\/\//i.test(u) || /^data:image\/(png|jpeg|webp);base64,/i.test(u) || /^(?![a-z]+:)[\w\-./]+\.(png|jpe?g|webp|svg)$/i.test(u));
const waOk = u => isConfigured(u) && /^https:\/\/(chat\.whatsapp\.com|wa\.me|(www\.)?whatsapp\.com)\//i.test(u);

/* ---------- state (memory only, never persisted) ---------- */
let form, step, err, errId, busy = false, memTok = null;
function reset() {
  form = { institute:'', email:'', lead:'', phone:'', extra:'', mates:[], boys:'', girls:'', domain:'', accom:'', utr:'', date:'', time:'', hp:'' };
  step = 1; err = ''; errId = '';
}
reset();
const extraCount = () => { const n = intOf(form.extra); return n <= MAX_EXTRA ? n : NaN; };
const teamSize = () => { const n = extraCount(); return Number.isNaN(n) ? NaN : n + 1; };

/* Idempotency token: random, non-sensitive. Reused for retries so the server
   returns the same Registration ID instead of creating a duplicate row. */
function makeToken() { const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, ''); }
function submissionToken() {
  try { let t = sessionStorage.getItem('hf_tok'); if (t && /^[A-Za-z0-9_-]{16,64}$/.test(t)) return t; t = makeToken(); sessionStorage.setItem('hf_tok', t); return t; }
  catch (e) { return memTok || (memTok = makeToken()); }
}
function clearToken() { try { sessionStorage.removeItem('hf_tok'); } catch (e) {} memTok = null; }

/* ---------- error display ---------- */
const E = (msg, id) => ({ msg, id });
function showErr(msg, id, focus) {
  err = msg; errId = id || '';
  const box = $('#err'); if (box) box.textContent = msg ? '⚠ ' + msg : '';
  document.querySelectorAll('#body input').forEach(i => i.removeAttribute('aria-invalid'));
  document.querySelectorAll('#body input.bad').forEach(i => i.classList.remove('bad'));
  const f = errId && $('#' + errId);
  if (msg && f) { f.classList.add('bad'); f.setAttribute('aria-invalid', 'true'); f.setAttribute('aria-describedby', 'err'); if (focus) f.focus(); }
}
const clearErr = () => showErr('', '', false);

/* ---------- steps ---------- */
const bars = n => `<div class="prog">${Array.from({length:TOTAL},(_,i)=>`<i class="${i+1<=n?'on':''}"></i>`).join('')}</div><div class="small">Step ${n} of ${TOTAL}</div>`;

function readMates() {
  for (let i = 0; i < MAX_EXTRA; i++) {
    if (!$('#mn' + i)) break;
    form.mates[i] = { n: clean($('#mn' + i).value), e: normEmail($('#me' + i).value), p: $('#mp' + i).value.trim() };
  }
}
function renderMates() {
  const n = extraCount(), k = Number.isNaN(n) ? 0 : n;
  $('#mates').innerHTML = Array.from({length:k}, (_, i) => `<div class="${i ? 'mate' : ''}"><b>Team Member ${i+1}</b>
    <label for="mn${i}">Full Name</label><input id="mn${i}" autocomplete="off" maxlength="80">
    <label for="me${i}">Email ID</label><input id="me${i}" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="254">
    <label for="mp${i}">WhatsApp / Phone Number</label><input id="mp${i}" type="tel" inputmode="tel" autocomplete="off" maxlength="16" placeholder="9876543210"></div>`).join('');
  for (let i = 0; i < k; i++) { const m = form.mates[i] || {}; $('#mn'+i).value = m.n || ''; $('#me'+i).value = m.e || ''; $('#mp'+i).value = m.p || ''; }
}
function pickable(attr, key) {
  document.querySelectorAll('[' + attr + ']').forEach(el => {
    const pick = () => { form[key] = el.getAttribute(attr); clearErr(); render(); const s = document.querySelector('[' + attr + '="' + CSS.escape(form[key]) + '"]'); if (s) s.focus(); };
    el.onclick = pick; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
}

const STEPS = [
 { title: 'Team lead', sub: "Tell us about your institute. We'll reach the lead for all updates.",
   html: () => `<label for="institute">Name of the Institute</label><input id="institute" autocomplete="organization" maxlength="120">
     <label for="email">Team Leader Email ID</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254">
     <label for="lead">Team Leader Name</label><input id="lead" autocomplete="name" maxlength="80">
     <label for="phone">Contact Number of Team Lead (WhatsApp Number)</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="9876543210 or +919876543210">`,
   after: () => { $('#institute').value = form.institute; $('#email').value = form.email; $('#lead').value = form.lead; $('#phone').value = form.phone; },
   collect: () => { form.institute = clean($('#institute').value); form.email = normEmail($('#email').value); form.lead = clean($('#lead').value); form.phone = $('#phone').value.trim(); },
   check: () => {
     if (!form.institute) return E('Enter the name of your institute.', 'institute');
     if (form.institute.length < 3 || !/\p{L}/u.test(form.institute) || /[<>]/.test(form.institute) || /^[=+\-@]/.test(form.institute)) return E('Enter a valid institute name.', 'institute');
     if (!form.email) return E('Enter the team leader email ID.', 'email');
     if (!emailOk(form.email)) return E('Enter a valid email address.', 'email');
     if (!form.lead) return E("Enter the team leader's name.", 'lead');
     if (!RE.name.test(form.lead)) return E('Enter a valid name (letters only).', 'lead');
     if (!normPhone(form.phone)) return E('Enter a valid 10-digit Indian mobile number (with or without +91).', 'phone');
     return null; } },

 { title: 'Team members', sub: 'Maximum team size is 5 including you.',
   html: () => `<label for="extra">How many additional team members are in your team?</label>
     <input id="extra" type="number" min="0" max="${MAX_EXTRA}" step="1" inputmode="numeric" pattern="[0-9]*">
     <div class="small">Enter 0 to 4.</div><div id="mates" aria-live="polite"></div>`,
   after: () => {
     $('#extra').value = form.extra; renderMates();
     $('#extra').addEventListener('input', e => {
       readMates(); form.extra = e.target.value.trim(); const n = extraCount();
       if (Number.isNaN(n)) showErr(`Enter a whole number from 0 to ${MAX_EXTRA}.`, 'extra', false);
       else { clearErr(); if (form.mates.length > n) form.mates.length = n; }
       renderMates();
     }); },
   collect: () => { form.extra = $('#extra').value.trim(); readMates(); },
   check: () => {
     const n = extraCount();
     if (Number.isNaN(n)) return E(`Enter a whole number of additional members from 0 to ${MAX_EXTRA}.`, 'extra');
     const emails = [form.email], phones = [normPhone(form.phone)];
     for (let i = 0; i < n; i++) {
       const m = form.mates[i] || { n:'', e:'', p:'' }, ph = normPhone(m.p), k = i + 1;
       if (!m.n) return E(`Enter the name of team member ${k}.`, 'mn' + i);
       if (!RE.name.test(m.n)) return E(`Enter a valid name for team member ${k}.`, 'mn' + i);
       if (!emailOk(m.e)) return E(`Enter a valid email for team member ${k}.`, 'me' + i);
       if (!ph) return E(`Enter a valid 10-digit number for team member ${k}.`, 'mp' + i);
       if (emails.includes(m.e)) return E(`Team member ${k} must have a different email from the others.`, 'me' + i);
       if (phones.includes(ph)) return E(`Team member ${k} must have a different phone number from the others.`, 'mp' + i);
       emails.push(m.e); phones.push(ph);
     }
     return null; } },

 { title: 'Boys and girls', sub: 'Tell us the gender split of your team.',
   html: () => { const t = teamSize(); return `<div class="small">Total team size: <b>${t}</b> (including you)</div>
     <label for="boys">Number of Boys</label><input id="boys" type="number" min="0" max="${t}" step="1" inputmode="numeric" pattern="[0-9]*">
     <label for="girls">Number of Girls</label><input id="girls" type="number" min="0" max="${t}" step="1" inputmode="numeric" pattern="[0-9]*">`; },
   after: () => {
     $('#boys').value = form.boys; $('#girls').value = form.girls;
     const live = () => { const t = teamSize(), b = intOf($('#boys').value), g = intOf($('#girls').value);
       if (!Number.isNaN(b) && !Number.isNaN(g) && b + g !== t) showErr('Boy + Girl count must equal total team size.', 'girls', false); else clearErr(); };
     $('#boys').addEventListener('input', live); $('#girls').addEventListener('input', live); },
   collect: () => { form.boys = $('#boys').value.trim(); form.girls = $('#girls').value.trim(); },
   check: () => {
     const t = teamSize(), b = intOf(form.boys), g = intOf(form.girls);
     if (Number.isNaN(b)) return E('Enter the number of boys as a whole number (0 if none).', 'boys');
     if (Number.isNaN(g)) return E('Enter the number of girls as a whole number (0 if none).', 'girls');
     if (b > t) return E(`Number of boys cannot be more than ${t}.`, 'boys');
     if (g > t) return E(`Number of girls cannot be more than ${t}.`, 'girls');
     if (b + g !== t) return E('Boy + Girl count must equal total team size.', 'girls');
     return null; } },

 { title: 'Choose your domain', sub: 'One domain per team.',
   html: () => `<div class="doms" role="radiogroup" aria-label="Domain">${DOMAINS.map(d => `<div class="dom ${form.domain===d[0]?'sel':''}" role="radio" tabindex="0" aria-checked="${form.domain===d[0]}" data-d="${esc(d[0])}"><b>${esc(d[0])}</b><span>${esc(d[1])}</span></div>`).join('')}</div>`,
   after: () => pickable('data-d', 'domain'), collect: () => {},
   check: () => DOMAINS.some(d => d[0] === form.domain) ? null : E('Pick a domain to continue.', '') },

 { title: 'Accommodation', sub: 'Accommodation Required On The Previous Day?',
   html: () => `<div class="doms" role="radiogroup" aria-label="Accommodation required on the previous day">${['Yes','No'].map(v => `<div class="dom ${form.accom===v?'sel':''}" role="radio" tabindex="0" aria-checked="${form.accom===v}" data-a="${v}"><b>${v}</b></div>`).join('')}</div>`,
   after: () => pickable('data-a', 'accom'), collect: () => {},
   check: () => (form.accom === 'Yes' || form.accom === 'No') ? null : E('Choose Yes or No.', '') },

 { title: 'Pay registration fee', sub: 'Pay once for the whole team.',
   html: () => `<div class="small">REGISTRATION FEE</div>
     <div class="pay"><div class="qr big" id="qr"></div><div><div class="amt" id="amt"></div><div class="small" id="upi"></div></div></div>
     <p class="small">Scan the QR code with any UPI app and pay the fee shown.</p>
     <label for="utr">Enter UTR Number</label><input id="utr" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="30">
     <label for="pdate">Date of Payment</label><input id="pdate" type="date">
     <label for="ptime">Time of Payment</label><input id="ptime" type="time">
     <p class="small">Enter the date and time at which you completed the payment.</p>
     <p class="small">Your registration is final only after the organizing team verifies your payment. Entering a UTR does not mark it as paid.</p>`,
   after: () => {
     const qr = $('#qr');
     if (imgOk(CONFIG.PAYMENT_QR_IMAGE)) { const im = document.createElement('img'); im.alt = 'UPI payment QR code'; im.referrerPolicy = 'no-referrer'; im.src = CONFIG.PAYMENT_QR_IMAGE; qr.appendChild(im); }
     else qr.textContent = 'UPI QR not configured';
     const fee = Number(CONFIG.REGISTRATION_FEE);
     $('#amt').textContent = '₹' + (Number.isFinite(fee) ? fee : '—');
     $('#upi').textContent = isConfigured(CONFIG.UPI_ID) ? 'UPI ID: ' + CONFIG.UPI_ID : '';
     $('#utr').value = form.utr; $('#pdate').value = form.date; $('#ptime').value = form.time;
     $('#pdate').max = todayStr(); $('#pdate').min = daysAgoStr(60); },
   collect: () => { form.utr = normUtr($('#utr').value); form.date = $('#pdate').value; form.time = $('#ptime').value; },
   check: () => {
     if (!form.utr) return E('Enter the UTR number from your UPI app.', 'utr');
     if (!RE.utr.test(form.utr)) return E('UTR must be 8 to 22 letters or digits, with no spaces or symbols.', 'utr');
     if (!RE.date.test(form.date) || isNaN(Date.parse(form.date))) return E('Enter the date of payment.', 'pdate');
     if (form.date > todayStr()) return E('Payment date cannot be in the future.', 'pdate');
     if (form.date < daysAgoStr(60)) return E('Payment date looks too old. Please check it.', 'pdate');
     if (!RE.time.test(form.time)) return E('Enter the time of payment.', 'ptime');
     if (form.date === todayStr() && form.time > nowHM()) return E('Payment time cannot be in the future.', 'ptime');
     return null; } }
];

/* ---------- pages ---------- */
function landing() {
  app.innerHTML = `
<section class="hero">
 <div class="tag">#The wait is over</div>
 <h1 class="brand">HackFusion<br>2K27</h1>
 <p class="lead">The clock starts.<br>Your idea takes over.</p>
 <div class="when">This October at VDIT</div>
 <button id="reg">Register your team</button>
</section>`;
  $('#reg').onclick = () => { reset(); location.hash = 'register'; };
}

function render() {
  const S = STEPS[step - 1];
  app.innerHTML = `<div class="nav"><a href="#">← Home</a><span class="brand" style="font-size:20px;text-shadow:2px 2px 0 var(--pink)">HackFusion 2K27</span></div>
  <div class="panel">${bars(step)}<h2 id="ttl" tabindex="-1" style="margin-top:14px">${esc(S.title)}</h2><p class="sub">${esc(S.sub)}</p>
  <div class="hp" aria-hidden="true"><label for="website_url">Leave this field empty</label><input id="website_url" name="website_url" type="text" tabindex="-1" autocomplete="off"></div>
  <div id="body">${S.html()}</div><div class="err" id="err" role="alert"></div>
  <div class="row">${step > 1 ? '<button class="ghost" id="back">Back</button>' : '<span></span>'}<button id="next">${step === TOTAL ? 'Submit registration' : 'Continue'}</button></div></div>`;
  S.after();
  if (err) showErr(err, errId, false);
  if ($('#back')) $('#back').onclick = () => { if (busy) return; collect(); clearErr(); step--; render(); window.scrollTo(0, 0); };
  $('#next').onclick = onNext;
  $('#body').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#next').click(); } });
}
function collect() {
  const hp = $('#website_url'); if (hp && hp.value) form.hp = hp.value;
  STEPS[step - 1].collect();
}
function onNext() {
  if (busy) return;
  collect();
  const e = STEPS[step - 1].check();
  if (e) { showErr(e.msg, e.id, true); return; }
  clearErr();
  if (step === TOTAL) { submit(); return; }
  step++; render(); window.scrollTo(0, 0); $('#ttl').focus({ preventScroll: true });
}

/* ---------- submission ---------- */
function buildPayload() {
  const n = extraCount();
  return {   // NOTE: no paymentStatus, no registration ID, no amount. The server decides those.
    token: submissionToken(), website_url: form.hp,
    institute: form.institute, leaderEmail: form.email, leaderName: form.lead, leaderPhone: normPhone(form.phone),
    additionalMembers: n,
    members: form.mates.slice(0, n).map(m => ({ name: m.n, email: m.e, phone: normPhone(m.p) })),   // slice: stale members never sent
    boys: intOf(form.boys), girls: intOf(form.girls),
    accommodation: form.accom, domain: form.domain,
    utr: form.utr, paymentDate: form.date, paymentTime: form.time
  };
}
async function postJSON(payload) {
  const url = CONFIG.GOOGLE_APPS_SCRIPT_URL;
  if (!/^https:\/\/script\.google\.com\//.test(url)) throw new Error('CONFIG_MISSING');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    // text/plain keeps this a "simple" request: Apps Script web apps do not answer CORS preflights.
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: ctrl.signal, redirect: 'follow', credentials: 'omit' });
    if (!r.ok) throw new Error('HTTP_' + r.status);
    let data; try { data = JSON.parse(await r.text()); } catch (e) { throw new Error('BAD_JSON'); }
    if (!data || typeof data !== 'object') throw new Error('BAD_JSON');
    return data;
  } finally { clearTimeout(timer); }
}
function setBusy(on, label) {
  busy = on; const n = $('#next'), b = $('#back');
  if (n) { n.disabled = on; n.textContent = label; }
  if (b) b.disabled = on;
}
async function submit() {
  if (busy) return;
  setBusy(true, 'Submitting…');
  const SAFE = 'Registration service is temporarily unavailable. Please try again.';
  try {
    const data = await postJSON(buildPayload());
    if (data.ok === true && /^HF27-\d{4,}$/.test(String(data.registrationId))) { clearToken(); reset(); showDone(data); return; }
    const code = String(data.code || '');
    const safeMsg = typeof data.message === 'string' ? data.message.slice(0, 200) : '';
    let msg = SAFE;
    if (code === 'VALIDATION' && safeMsg) msg = safeMsg;
    else if (code === 'DUPLICATE_TEAM') msg = 'This email or phone number is already registered. If you think this is a mistake, please contact the organizing team.';
    else if (code === 'RATE_LIMITED') msg = 'Too many attempts. Please wait a few minutes and try again.';
    else if (code === 'CLOSED') msg = 'Registrations are currently closed.';
    console.warn('[HackFusion] server responded with code:', code || 'unknown');
    showErr(msg, '', false); setBusy(false, 'Try again');
  } catch (e) {
    console.warn('[HackFusion] submit failed:', e && e.message ? e.message : 'unknown');
    showErr(navigator.onLine === false ? 'You appear to be offline. Check your connection and try again.' : SAFE, '', false);
    setBusy(false, 'Try again');   // form is NOT cleared; the same token is reused on retry
  }
}

function showDone(d) {
  app.innerHTML = `<section class="hero"><div class="tag">✓ REGISTRATION RECEIVED</div>
   <h1 class="brand" style="font-size:clamp(36px,10vw,72px)">Registration<br>Successful</h1>
   <div class="stats" style="width:100%;grid-template-columns:1fr;text-align:left">
    <div class="stat"><span class="small">Registration ID</span><b id="d-id"></b></div>
    <div class="stat"><span class="small">Team Leader</span><b id="d-lead"></b></div>
    <div class="stat"><span class="small">Institute</span><b id="d-inst"></b></div>
    <div class="stat"><span class="small">Domain</span><b id="d-dom"></b></div>
    <div class="stat"><span class="small">Payment</span><b id="d-pay"></b></div></div>
   <p class="lead" style="font-size:22px" id="d-note"></p>
   <p class="small">You will receive further communication from the organizing team.</p>
   <a class="btn" id="wa" target="_blank" rel="noopener noreferrer" hidden>Join WhatsApp channel</a><a class="small" href="#" style="color:var(--mut)">Back to home</a></section>`;
  const t = (id, v) => { $(id).textContent = String(v == null ? '' : v); };
  t('#d-id', d.registrationId); t('#d-lead', d.leaderName); t('#d-inst', d.institute); t('#d-dom', d.domain);
  const verified = d.paymentStatus === 'VERIFIED';
  t('#d-pay', verified ? 'Verified' : 'Pending Verification');
  t('#d-note', verified ? 'Your payment has been verified.' : 'Your payment will be verified by the organizing team.');
  if (waOk(CONFIG.WHATSAPP_LINK)) { const a = $('#wa'); a.href = CONFIG.WHATSAPP_LINK; a.hidden = false; }
  else console.warn('[HackFusion] WHATSAPP_LINK is not configured.');
  window.scrollTo(0, 0);
}

/* ---------- routing + startup checks ---------- */
function route() { const h = location.hash.slice(1); window.scrollTo(0, 0); if (h === 'register') render(); else landing(); }
addEventListener('hashchange', route);
(function startupChecks() {
  const missing = ['GOOGLE_APPS_SCRIPT_URL', 'PAYMENT_QR_IMAGE', 'UPI_ID', 'WHATSAPP_LINK'].filter(k => !isConfigured(CONFIG[k]));
  if (missing.length) console.warn('[HackFusion] CONFIG not set:', missing.join(', '));
  if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) console.warn('[HackFusion] Serve this page over HTTPS.');
})();
route();
</script></body></html>
